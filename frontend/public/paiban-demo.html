<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排版管理 · 页面 Demo（静态原型）</title>
<style>
:root{
  --bg-app:#f3f5f9; --sidebar-bg:#1e293b; --sidebar-active:rgba(47,111,237,.16);
  --surface:#fff; --border:#e4e9f0; --border-subtle:#eff2f8;
  --text-primary:#0f172a; --text-secondary:#64748b; --text-muted:#94a3b8;
  --accent:#2f6fed; --accent-hover:#2659c9; --accent-soft:#eaf1fe;
  --success:#0f9d6b; --success-soft:#ecfdf3;
  --warning:#d98a1f; --warning-soft:#fef7ed;
  --danger:#d9544d; --danger-soft:#fef2f2;
  --violet:#7c3aed; --violet-soft:#f3e8ff;
  --radius-sm:10px; --radius-md:16px; --radius-lg:22px;
  --shadow-card:0 2px 12px -3px rgba(15,23,42,.08),0 1px 3px -1px rgba(15,23,42,.06);
  --shadow-elevated:0 16px 48px -12px rgba(15,23,42,.18);
  --sidebar-w:220px;
}
*{box-sizing:border-box}
html{font-size:14px;-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--bg-app);color:var(--text-primary);font-family:'Outfit','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
/* ── 侧栏 ── */
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);color:#cbd5e1;flex:0 0 var(--sidebar-w);position:sticky;top:0;height:100vh;overflow:auto}
.logo{padding:22px 20px 18px;display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:16px;letter-spacing:.3px;border-bottom:1px solid rgba(255,255,255,.07)}
.logo-i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#2f6fed,#7c3aed);display:grid;place-items:center;font-size:14px}
.nav-group{padding:16px 10px 6px;font-size:11px;color:#64748b;letter-spacing:1px;padding-left:20px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 14px;margin:2px 10px;border-radius:9px;font-size:13.5px;color:#cbd5e1;cursor:pointer;transition:.18s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.nav-item .ico{width:18px;text-align:center;opacity:.85}
.nav-item.dim{opacity:.62}
.nav-badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;padding:2px 6px;border-radius:6px;font-weight:700}
.nav-insert{margin:4px 12px;padding:5px 8px;border-left:2px dashed #2f6fed;color:#7ea6f8;font-size:10.5px;line-height:1.4}
.sidebar-foot{padding:16px 18px;margin-top:20px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#64748b;line-height:1.7}
/* ── 主区 ── */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 26px;gap:14px;position:sticky;top:0;z-index:20}
.crumb{color:var(--text-muted);font-size:12.5px}
.crumb b{color:var(--text-primary);font-weight:600}
.topbar h1{margin:0;font-size:17px;font-weight:700}
.subtitle{font-size:12px;color:var(--text-secondary);background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:6px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.demo-flag{font-size:11px;color:var(--warning);background:var(--warning-soft);border:1px solid #f6dfb8;padding:4px 9px;border-radius:7px}
.btn{border:1px solid var(--border);background:#fff;padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:600;transition:.18s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover);color:#fff}
.btn.danger{color:var(--danger);border-color:#f3c9c6}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:11.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* 版本条 */
.versionbar{background:#fff;border-bottom:1px solid var(--border);padding:11px 26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.versionbar label{font-size:12px;color:var(--text-secondary);font-weight:600}
.versionbar select{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;font-weight:600;min-width:230px}
.vfacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vfact{font-size:11.5px;color:var(--text-secondary);background:var(--bg-app);border:1px solid var(--border-subtle);padding:5px 9px;border-radius:7px}
.vfact b{color:var(--text-primary)}
.vbar-note{margin-left:auto;font-size:11.5px;color:var(--text-muted)}
/* tabs */
.tabs{display:flex;gap:2px;padding:0 26px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:60px;z-index:19;overflow-x:auto}
.tab{padding:12px 16px 11px;font-size:13px;color:var(--text-secondary);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-weight:600}
.tab:hover{color:var(--accent)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warning);margin-left:5px;vertical-align:middle}
/* 页面 */
.page{padding:18px 26px 60px;max-width:1560px;width:100%}
.hint{display:flex;align-items:flex-start;gap:10px;background:var(--accent-soft);border:1px solid #d5e4fd;border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:12.5px;color:#1c4fb8;line-height:1.6}
.hint .q{margin-left:auto;white-space:nowrap}
.hint-detail{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed #bcd3fa;color:#31558f;font-size:12px}
.hint.open .hint-detail{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-card);margin-bottom:16px;overflow:hidden}
.card-hd{padding:13px 16px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:10px;font-weight:700;font-size:13.5px}
.card-hd .right{margin-left:auto;display:flex;gap:7px;align-items:center;font-weight:400}
.card-bd{padding:14px 16px}
.muted{color:var(--text-muted);font-size:11.5px;font-weight:400}
.sec-title{font-size:13px;font-weight:700;margin:2px 0 10px;display:flex;align-items:center;gap:8px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(8,1fr);gap:11px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 13px;box-shadow:var(--shadow-card);cursor:pointer;transition:.18s;position:relative}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-elevated);border-color:#c9dcff}
.kpi .lb{font-size:11.5px;color:var(--text-secondary);margin-bottom:7px;display:flex;align-items:center;gap:5px}
.kpi .vl{font-size:23px;font-weight:700;line-height:1;letter-spacing:-.5px}
.kpi .unit{font-size:11px;color:var(--text-muted);font-weight:500;margin-left:3px}
.kpi .tip{margin-top:6px;font-size:10.5px;color:var(--text-muted)}
.kpi.k-warn .vl{color:var(--warning)} .kpi.k-danger .vl{color:var(--danger)}
.kpi.k-ok .vl{color:var(--success)} .kpi.k-violet .vl{color:var(--violet)}
.kpi .dec{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--warning)}
/* 徽标 */
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;padding:2px 7px;border-radius:6px;font-weight:600;white-space:nowrap;line-height:1.5}
.b-req{background:var(--accent-soft);color:var(--accent)} .b-bug{background:var(--warning-soft);color:var(--warning)}
.b-ok{background:var(--success-soft);color:var(--success)} .b-wait{background:#eef2f7;color:#475569}
.b-no{background:var(--danger-soft);color:var(--danger)} .b-over{background:var(--danger-soft);color:var(--danger)}
.b-risk{background:var(--warning-soft);color:var(--warning)} .b-defer{background:var(--violet-soft);color:var(--violet)}
.b-default{background:#f1f5f9;color:#64748b;border:1px dashed #cbd5e1} .b-soft{background:#f8fafc;color:var(--text-secondary);border:1px solid var(--border)}
.b-new{background:var(--accent);color:#fff} .b-gate{background:#fff4e5;color:#b26a00;border:1px solid #f3d5a6}
/* 决策点卡 */
.decision-card{border:1px solid #f3d5a6;background:linear-gradient(180deg,#fffaf1,#fff);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:14px 16px;margin-bottom:16px}
.dc-hd{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13.5px;margin-bottom:4px}
.dc-tag{background:var(--warning);color:#fff;font-size:10px;padding:2px 7px;border-radius:5px}
.dc-desc{font-size:12px;color:var(--text-secondary);line-height:1.65;margin-bottom:12px}
.sim-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sim-seg{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.sim-seg button{border:0;background:#fff;padding:7px 13px;font-size:12px;border-right:1px solid var(--border);font-weight:600}
.sim-seg button:last-child{border-right:0}
.sim-seg button.on{background:var(--accent);color:#fff}
.sim-out{flex:1;min-width:280px;border-radius:10px;padding:10px 13px;font-size:12.5px;line-height:1.6;border:1px solid var(--border);background:#fff}
.sim-out.ok{background:var(--success-soft);border-color:#b7e6cf;color:#0b6b4a}
.sim-out.no{background:var(--danger-soft);border-color:#f3c9c6;color:#a3312b}
/* 泳道 */
.lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 16px 18px}
.lane{background:#f8fafc;border:1px solid var(--border-subtle);border-radius:12px;min-height:180px}
.lane-hd{padding:10px 12px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px}
.lane-hd .cnt{margin-left:auto;background:#fff;border:1px solid var(--border);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--text-secondary)}
.lane-due{font-size:10.5px;color:var(--text-muted);font-weight:500;margin-top:3px}
.lane-bd{padding:9px;display:flex;flex-direction:column;gap:8px}
.tkt{background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 10px;cursor:pointer;transition:.18s;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.tkt:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-card)}
.tkt-top{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.tkt-id{font-size:10.5px;color:var(--text-muted);font-family:ui-monospace,Consolas,monospace}
.tkt-name{font-size:12.5px;font-weight:600;line-height:1.45;margin-bottom:6px}
.tkt-meta{font-size:11px;color:var(--text-secondary);margin-bottom:7px}
.tkt-foot{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding-top:7px;border-top:1px dashed var(--border-subtle)}
.tkt-foot .r{margin-left:auto;font-size:10.5px;color:var(--danger);font-weight:600}
/* 表格 */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:9px 10px;background:#f8fafc;color:var(--text-secondary);font-weight:600;font-size:11.5px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--border-subtle);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.rowlink{cursor:pointer} tr.rowlink:hover td{background:#f8fbff}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
.nowrap{white-space:nowrap}
/* 倒排条 */
.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin:8px 0 4px}
.tl-node{text-align:center;position:relative;padding-top:20px}
.tl-node:before{content:'';position:absolute;top:7px;left:0;right:0;height:2px;background:#dbe4f3}
.tl-node:first-child:before{left:50%} .tl-node:last-child:before{right:50%}
.tl-dot{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px #dbe4f3;z-index:1}
.tl-node:last-child .tl-dot{background:var(--success)}
.tl-lb{font-size:11.5px;font-weight:600} .tl-dt{font-size:11px;color:var(--text-muted);margin-top:2px}
.tl-off{font-size:10px;color:var(--accent);margin-top:2px}
/* 矩阵 */
.matrix td.cell{text-align:center;cursor:pointer;font-weight:700}
.matrix td.cell:hover{background:var(--accent-soft)}
.cellnum{display:inline-block;min-width:28px;padding:3px 7px;border-radius:7px;background:var(--accent-soft);color:var(--accent)}
.cellnum.hot{background:var(--danger-soft);color:var(--danger)}
.callout{background:#fffbeb;border:1px solid #f6dfb8;border-radius:9px;padding:9px 12px;font-size:12px;color:#8a5a0b;line-height:1.6;margin-bottom:12px}
.callout.blue{background:var(--accent-soft);border-color:#d5e4fd;color:#1c4fb8}
.callout.red{background:var(--danger-soft);border-color:#f3c9c6;color:#a3312b}
.callout.green{background:var(--success-soft);border-color:#b7e6cf;color:#0b6b4a}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{font-size:11.5px;background:#fff;border:1px solid var(--border);padding:5px 10px;border-radius:8px;color:var(--text-secondary)}
.pill b{color:var(--text-primary)}
/* 反馈 */
.fb-item{border:1px solid var(--border);border-radius:11px;padding:12px 13px;margin-bottom:10px;background:#fff}
.fb-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.fb-raw{background:#f8fafc;border-left:3px solid #cbd5e1;padding:9px 11px;border-radius:0 8px 8px 0;font-size:12px;color:#475569;line-height:1.6;margin-bottom:9px;white-space:pre-wrap}
.fb-parse{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:9px}
.fb-f{background:#f8fafc;border-radius:8px;padding:7px 9px;font-size:11px}
.fb-f .k{color:var(--text-muted);margin-bottom:3px} .fb-f .v{font-weight:600;font-size:12px}
.fb-act{display:flex;gap:7px;justify-content:flex-end;align-items:center}
.chan{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.chan-c{border:1px solid var(--border);border-radius:11px;padding:11px 12px;cursor:pointer;transition:.18s;background:#fff}
.chan-c:hover{border-color:var(--accent);box-shadow:var(--shadow-card)}
.chan-c .n{font-size:11px;color:var(--accent);font-weight:700;margin-bottom:5px}
.chan-c .t{font-size:12.5px;font-weight:600;margin-bottom:4px}
.chan-c .d{font-size:11px;color:var(--text-muted);line-height:1.5}
/* 表单 */
.form-row{display:flex;gap:10px;margin-bottom:11px;align-items:flex-start}
.form-row label{width:110px;flex:0 0 110px;font-size:12px;color:var(--text-secondary);padding-top:8px;font-weight:600}
.form-row .ctl{flex:1;min-width:0}
.form-row input[type=text],.form-row input[type=date],.form-row select,.form-row textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff}
.form-row textarea{min-height:78px;resize:vertical;line-height:1.6}
.form-row .hintx{font-size:11px;color:var(--text-muted);margin-top:5px;line-height:1.5}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:6px 0;cursor:pointer}
.chk input{accent-color:var(--accent)}
/* 抽屉 / 弹窗 */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.34);z-index:50;display:none;animation:fade .2s}
.overlay.show{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,94vw);background:#fff;z-index:51;box-shadow:var(--shadow-elevated);transform:translateX(102%);transition:.28s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column}
.drawer.show{transform:none}
.dw-hd{padding:17px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.dw-hd h3{margin:0 0 5px;font-size:15px} .dw-hd .x{margin-left:auto;font-size:20px;color:var(--text-muted);cursor:pointer;line-height:1}
.dw-bd{padding:16px 20px;overflow:auto;flex:1}
.dw-ft{padding:13px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:#fafbfd}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-48%) scale(.98);width:min(860px,94vw);max-height:88vh;background:#fff;border-radius:var(--radius-lg);z-index:51;box-shadow:var(--shadow-elevated);display:none;flex-direction:column;animation:pop .22s}
.modal.show{display:flex}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-48%) scale(1)}}
.md-hd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px}
.md-hd .x{margin-left:auto;color:var(--text-muted);cursor:pointer;font-size:20px;line-height:1}
.md-bd{padding:16px 20px;overflow:auto}
.md-ft{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;align-items:center;background:#fafbfd;border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.mailprev{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:14px;font-size:12px;line-height:1.7;color:#334155;max-height:330px;overflow:auto;font-family:ui-monospace,Consolas,'PingFang SC',monospace;white-space:pre-wrap}
.dtabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--border-subtle);padding-bottom:8px}
.dtab{padding:6px 11px;border-radius:8px;font-size:12px;cursor:pointer;color:var(--text-secondary)}
.dtab.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
/* 决策面板 */
.dec-btn{position:fixed;right:22px;bottom:22px;z-index:40;background:var(--text-primary);color:#fff;border:0;border-radius:999px;padding:12px 18px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow-elevated)}
.dec-btn:hover{background:var(--accent)}
.dec-panel{position:fixed;right:22px;bottom:76px;width:min(470px,92vw);max-height:76vh;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-elevated);z-index:41;display:none;flex-direction:column;border:1px solid var(--border)}
.dec-panel.show{display:flex}
.dec-hd{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.dec-hd .x{margin-left:auto;cursor:pointer;color:var(--text-muted);font-size:18px}
.dec-bd{padding:12px 16px;overflow:auto}
.dec-item{border:1px solid var(--border);border-radius:10px;padding:10px 11px;margin-bottom:9px}
.dec-item .t{font-size:12.5px;font-weight:600;margin-bottom:3px}
.dec-item .d{font-size:11.5px;color:var(--text-secondary);line-height:1.5;margin-bottom:8px}
.dec-item .ops{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dec-item input[type=text]{flex:1;min-width:150px;padding:5px 8px;border:1px solid var(--border);border-radius:7px;font-size:11.5px}
.opt{padding:4px 10px;border:1px solid var(--border);border-radius:7px;font-size:11.5px;background:#fff}
.opt.on-ok{background:var(--success-soft);border-color:#b7e6cf;color:var(--success);font-weight:700}
.opt.on-no{background:var(--warning-soft);border-color:#f3d5a6;color:#b26a00;font-weight:700}
.dec-ft{padding:11px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
/* toast */
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%) translateY(-14px);z-index:80;background:var(--text-primary);color:#fff;padding:10px 16px;border-radius:10px;font-size:12.5px;box-shadow:var(--shadow-elevated);opacity:0;transition:.24s;pointer-events:none;max-width:80vw;line-height:1.5}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--success)} .toast.err{background:var(--danger)} .toast.warn{background:var(--warning)}
.foot-note{font-size:11.5px;color:var(--text-muted);line-height:1.8;margin-top:22px;border-top:1px dashed var(--border);padding-top:12px}

/* ===================== 决策面板 ===================== */
function renderDec(){
  const done=decState.filter(d=>d.v).length;
  const pending=DECISIONS.length-done;
  $('#decCount').textContent=done;
  let h='<div class="dec-hd">决策结论 '+done+'/'+DECISIONS.length+' 项 <span class="muted" style="font-weight:400">已回填 11-18 11:34 表态 · 可改选</span><span class="x" data-act="closeDec">×</span></div><div class="dec-bd">';
  DECISIONS.forEach((d,i)=>{
    const s=decState[i];
    h+='<div class="dec-item"><div class="t">'+(i+1)+'. '+esc(d.t)+'</div><div class="d">'+esc(d.d)+'</div><div class="ops">'+
     '<button class="opt '+(s.v==='同意'?'on-ok':'')+'" data-act="dec" data-i="'+i+'" data-v="同意">✓ 同意</button>'+
     '<button class="opt '+(s.v==='要调整'?'on-no':'')+'" data-act="dec" data-i="'+i+'" data-v="要调整">✎ 要调整</button>'+
     '<input type="text" data-note="'+i+'" value="'+esc(s.note)+'" placeholder="调整意见 / 新值（如：−12/−7/−3/−1）"></div></div>';
  });
  h+='</div><div class="dec-ft"><span class="muted" style="margin-right:auto">已表态 '+done+' / '+DECISIONS.length+' 项'+(pending?'（剩余 '+pending+' 项未表态）':'')+'</span><button class="btn" data-act="decReset">清空</button><button class="btn primary" data-act="decCopy">复制决策结论</button></div>';
  $('#decPanel').innerHTML=h;
  $('#decPanel').querySelectorAll('[data-note]').forEach(el=>el.oninput=e=>{decState[+e.target.dataset.note].note=e.target.value});
}
function copyDec(){
  let s='排版管理 Demo 决策结论（'+new Date().toLocaleString('zh-CN')+'）\n\n';
  DECISIONS.forEach((d,i)=>{const x=decState[i];s+=(i+1)+'. '+d.t+'\n   → '+(x.v||'未表态')+(x.note?'　备注：'+x.note:'')+'\n'});
  s+='\n（未表态 ' + decState.filter(x=>!x.v).length + ' 项）';
  const ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('决策结论已复制，可直接贴回对话给我','ok')}catch(e){toast('复制失败，请手动选择','err')}
  ta.remove();
}

/* ===================== 事件 ===================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==='close'){closeAll();return}
  if(a==='closeDec'){$('#decPanel').classList.remove('show');return}
  if(a==='page'){curPage=el.dataset.k;hintOpen=false;renderTabs();renderPage();window.scrollTo({top:0,behavior:'smooth'});return}
  if(a==='hint'){hintOpen=!hintOpen;const h=$('#hintBox');h.className='hint'+(hintOpen?' open':'');el.textContent=hintOpen?'收起':'对应目标 ↗';return}
  if(a==='overview'){overviewModal();return}
  if(a==='openDec'){closeAll();$('#decPanel').classList.add('show');return}
  if(a==='plan'){curPage='plan';hintOpen=false;renderTabs();renderPage();return}
  if(a==='goFeedback'){curPage='feedback';hintOpen=false;renderTabs();renderPage();return}
  if(a==='gateScroll'){const g=$('#gateSim');if(g)g.scrollIntoView({behavior:'smooth',block:'center'});return}
  if(a==='ticket'){ticketDrawer(id);return}
  if(a==='candidate'){candidateModal();return}
  if(a==='doCandidate'){closeAll();toast('已按幂等规则纳入 3 单：主行各 1 条、子行按团队拆分，源工单未被改动（Demo）','ok');return}
  if(a==='planDetail'){if(e.target.closest('[data-act="editPlan"]'))return;planDetail(id);return}
  if(a==='editPlan'){closeAll();planForm(id);return}
  if(a==='addPlan'){planForm(null);return}
  if(a==='savePlan'){closeAll();toast('已保存（Demo）：发布日派生四环节截止与准入时点，并写一条计划变更日志','ok');return}
  if(a==='fallback'){openModal(md('默认计划回落清单','<div class="callout blue">未单独配置版本计划的系统 → 统一默认 2026-11 版（发布日 11-28），主行标「计划来源 = 默认」。<b>回落不落副本</b>：默认计划改期，以下工单的截止日与准入时点同步重算。</div><table><thead><tr><th>系统</th><th>在跟工单</th><th>工单示例</th><th>计划来源</th></tr></thead><tbody><tr><td>电子协议</td><td>2</td><td class="mono">REQ-2026-1078 / BUG-2026-0871</td><td><span class="badge b-default">默认</span></td></tr><tr><td>生产运营平台</td><td>1</td><td class="mono">BUG-2026-0862</td><td><span class="badge b-default">默认</span></td></tr><tr><td>商客专区</td><td>0</td><td class="muted">—</td><td><span class="badge b-default">默认</span></td></tr><tr><td>政企工作台</td><td>0</td><td class="muted">—</td><td><span class="badge b-default">默认</span></td></tr></tbody></table>','<button class="btn primary" data-act="close">知道了</button>'));return}
  if(a==='sim'){simDays=+el.dataset.d;renderPage();toast(simDays<=-7?'判定：已准入（提前 '+-simDays+' 天进入等待发布）':'判定：未准入 → 自动顺延下一版',simDays<=-7?'ok':'err');return}
  if(a==='defer'){
    const t=ticket(id); if(t){t.defer+=1;t.gate='待判定';t.ver=nextVerOf(curVer);t.stage='开发中';t.risk='准入未通过（系统生成）';t.block=true;}
    closeAll();renderPage();toast('自动顺延完成：改挂 CRM 2026-12 常规版 · 准入复位待判定 · 顺延次数 +1 · 环节回滚 · 自动登记风险 · 全口径重算（主行唯一，未关闭）。切到「CRM 2026-12 常规版」可看到该单继续在跟','ok');return;
  }
  if(a==='manual'){manualModal(id);return}
  if(a==='doManual'){
    const r=$('#manReason'),nt=$('#manNote');
    if(!r||!r.value){toast('例外放行必须选择原因，提交被拒（规则生效）','err');return}
    if(r.value.indexOf('其他')>=0&&(!nt||!nt.value.trim())){toast('原因选「其他」时必须填写说明','err');return}
    const t=ticket(id); if(t){t.manual=true;t.gate='人工例外准入';t.manReason=r.value;t.manNote=nt?nt.value:'';t.manBy='陈大海';}
    closeAll();renderPage();toast('例外放行已生效：主行留本版 · 准入状态=人工例外准入 · 四要素留痕 + 变更日志 · 单列「人工例外」清单（计入分母，不计入按计划上线率分子）· 采纳前值可一键撤销','ok');return;
  }
  if(a==='undoManual'){
    const t=ticket(id); if(t){t.manual=false;t.manReason='';t.gate='待判定';t.defer+=1;t.ver=nextVerOf(curVer);t.stage='开发中';t.risk='准入未通过（系统生成）';t.block=true;}
    closeAll();renderPage();toast('已撤销例外 → 回到未准入并按默认自动顺延；留痕与采纳前值保留不删','warn');return;
  }
  if(a==='doStage'){
    const t=ticket(id),to=$('#stageSel').value,from=t.stage;
    const fi=STAGES.findIndex(s=>s.k===from),ti=STAGES.findIndex(s=>s.k===to);
    if(ti<fi&&!$('#backReason').value.trim()){toast('回退必须填写原因，提交被拒（规则生效）','err');return}
    if(Math.abs(ti-fi)>1){toast('不可跳级：四环节须逐级推进','err');return}
    t.stage=to;closeAll();renderPage();toast('环节已更新：'+from+' → '+to+(ti<fi?'（回退已留痕 + 自动生成风险 + 重新触发准入判定）':'（已写流转留痕）'),'ok');return;
  }
  if(a==='doResult'){
    const t=ticket(id),res=$('#resSel').value;
    const blocked=RISKS.some(r=>r.tid===id&&r.impact==='是'&&r.st!=='已消除'&&r.st!=='已转顺延')||t.block;
    if(res==='已上线'&&blocked){toast('⛔ 硬门禁拦截：存在「影响本版上线且未消除」的风险，不能登记「已上线」','err');return}
    if(res!=='已上线'&&!$('#resReason').value.trim()){toast('未排进版本 / 上线失败 / 取消必须填写原因','err');return}
    if(res==='已上线'){toast('已登记「已上线」→ 终态，主行关闭，计入本版按计划上线数','ok');}
    else if(res==='取消或撤回'){toast('已登记「取消或撤回」→ 终态，不再自动顺延','ok');}
    else{t.defer+=1;t.gate='待判定';t.ver=nextVerOf(curVer);t.stage=res==='上线失败'?'开发中':t.stage;t.risk=res==='上线失败'?'上线失败（系统生成）':'准入未通过（系统生成）';t.block=true;
      closeAll();renderPage();toast('结果「'+res+'」已登记 → 自动顺延下一版：主行改挂 + 准入复位 + 顺延 +1 + 环节回滚 + 自动风险 + 全口径重算（持续跟踪直到成功上线）','warn');return;}
    closeAll();renderPage();return;
  }
  if(a==='srcLink'){toast('Demo 不跳转：实际会带工单锚深链回需求详情 / BUG 工单详情，且源模块不反向展示排版态');return}
  if(a==='drill'){
    const tm=el.dataset.team,st=el.dataset.stage;
    const ts=TICKETS.filter(t=>t.teams.includes(tm)&&t.stage===st);
    openModal(md('下钻明细 · '+tm+' / '+st,'<div class="callout blue">口径：格内数字 = 下钻明细条数 = 筛选条件 = 当前版本，四者同源（'+ts.length+' 条）。</div>'+
     (ts.length?'<table><thead><tr><th>工单</th><th>类型</th><th>系统</th><th>准入</th><th>超期</th><th>顺延</th><th>最近反馈</th></tr></thead><tbody>'+ts.map(t=>'<tr><td class="mono">'+t.id+'<div class="muted">'+esc(t.name)+'</div></td><td>'+t.type+'</td><td>'+t.sys+'</td><td><span class="badge '+(t.gate==='已准入'?'b-ok':'b-wait')+'">'+t.gate+'</span></td><td>'+(t.over>0?'<span class="badge b-over">'+t.over+' 天</span>':'—')+'</td><td>'+t.defer+'</td><td class="muted">'+t.fb+'</td></tr>').join('')+'</tbody></table>':'<div class="muted">该团队该环节当前无工单</div>'),'<button class="btn primary" data-act="close">关闭</button>'));return;
  }
  if(a==='typeFilter'){toast('Demo：类型筛选可切「全部 / 需求 / BUG」，条件会带进下钻与导出（同版本口径）');return}
  if(a==='supervise'){superviseModal(el.dataset.team,el.dataset.type);return}
  if(a==='doSend'){closeAll();toast('Demo 未真发：真发仅由老大在页面显式点击（confirm_send），AI / 自测全程 dry_run','warn');return}
  if(a==='batchDetail'){toast('批次明细：逐单发送状态 / 回执码 / 督办序次 / 回执收到时间 / 失败原因，可按工单锚查全部历史');return}
  if(a==='addRisk'){openModal(md('登记风险事件','<div class="callout">风险按<b>工单维度</b>登记，一单可多条；类型闭集字典，禁自由建类。跨版本顺延时风险随主行延续，不因换版本重置为「新风险」。</div>'+
   '<div class="form-row"><label>工单锚</label><div class="ctl"><select>'+TICKETS.slice(0,5).map(t=>'<option>'+t.id+'</option>').join('')+'</select></div></div>'+
   '<div class="form-row"><label>风险类型</label><div class="ctl"><select><option>需求变更</option><option>方案未定</option><option>开发延期</option><option>测试阻塞</option><option>环境与依赖</option><option>发布窗口冲突</option><option>准入未通过</option><option>上线失败</option><option>资源不足</option><option>其他</option></select></div></div>'+
   '<div class="form-row"><label>影响团队范围</label><div class="ctl"><input type="text" placeholder="跨团队工单须标具体团队"></div></div>'+
   '<div class="form-row"><label>是否影响本版上线</label><div class="ctl"><label class="chk"><input type="checkbox" checked> 是（触发硬门禁 + 自动进督办对象）</label></div></div>'+
   '<div class="form-row"><label>描述 / 发现日 / 责任人</label><div class="ctl"><textarea placeholder="必填"></textarea></div></div>','<button class="btn" data-act="close">取消</button><button class="btn primary" data-act="doRisk">登记（Demo）</button>'));return}
  if(a==='doRisk'){closeAll();toast('风险已登记：若同工单同类型已有未消除风险，则合并更新而非新建','ok');return}
  if(a==='bulkUpdate'){bulkModal(el.dataset.team||'CRM 团队');return}
  if(a==='doBulk'){closeAll();toast('已提交 4 条：同一套流转留痕 + 风险对象，来源=团队批量更新，超期/督办候选/门禁已重算','ok');return}
  if(a==='quickNote'){noteModal(id,false);return}
  if(a==='proxyNote'){noteModal(null,true);return}
  if(a==='doNote'){closeAll();toast('已留痕并自动采纳：原文保留、标来源、采纳前值可一键回滚','ok');return}
  if(a==='inbox'){toast('邮件中心收件箱只读拉取：结构化回执自动采纳；1 批不可达 → 标「待自动补跑」，不转人工、不丢原文','ok');return}
  if(a==='adoptDemo'){toast('演示：FB-0230 已按「唯一回执码 + 四字段」自动采纳 → 写流转留痕 + 原文引用 + 采纳前值（可回滚）','ok');return}
  if(a==='adopt'){toast(id+' 已人工核对采纳：写留痕、更新环节与风险，采纳前值保留可回滚','ok');return}
  if(a==='reject'){toast(id+' 已驳回：原文与反馈记录保留不删，核对说明已记录');return}
  if(a==='rollback'){toast(id+' 已回滚到采纳前值（测试中 / 预计 11-24），回滚本身写一条留痕，原文不删','warn');return}
  if(a==='viewRaw'){const f=FEEDBACK.find(x=>x.id===id);openModal(md('反馈原文 · '+id,'<div class="callout blue">来源 '+esc(f.src)+' ｜ 工单 '+esc(f.tid)+' ｜ 发件人 '+esc(f.from)+' ｜ '+f.time+' ｜ Message-ID 已记录（幂等）</div><div class="fb-raw">'+esc(f.raw)+'</div><div class="callout" style="margin:0">'+esc(f.note)+'</div>','<button class="btn primary" data-act="close">关闭</button>'));return}
  if(a==='dec'){const i=+el.dataset.i;decState[i].v=el.dataset.v;renderDec();return}
  if(a==='decReset'){decState.forEach(d=>{d.v='';d.note=''});renderDec();toast('已清空表态');return}
  if(a==='decCopy'){copyDec();return}
});
$('#overlay').addEventListener('click',closeAll);
$('#decBtn').addEventListener('click',()=>{$('#decPanel').classList.toggle('show')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAll();$('#decPanel').classList.remove('show')}});

renderAll();renderDec();
</script>
</body>
</html>
